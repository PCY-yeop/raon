<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숭의역 라온프라이빗 스카이브 - 프라이빗 브리핑북</title>
    
    <!-- PWA 매니페스트 연결 (오프라인 표시 방지) -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA 모바일 앱 설정 메타 태그 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="라온스카이브">
    <meta name="theme-color" content="#0d1b3e">
    
    <!-- 외부 라이브러리 (Tailwind CSS, Font Awesome) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 대표 이미지 리로드 -->
    <link rel="preload" as="image" href="images/sam.jpg">
    
    <!-- 📂 외부 CSS 및 JS 연결 영역 (버전 번호를 변경하여 배포하면 태블릿 캐시가 즉시 업데이트됩니다) -->
    <link rel="stylesheet" href="css/desktop.css?v=1.1">
    <script src="script.js?v=1.1" defer></script>
</head>

<body class="bg-gray-100 text-gray-800 h-screen w-screen overflow-hidden flex">

    <!-- 1차 메인 사이드바 (좌측 최외곽 / 네이비 배경) -->
    <aside class="w-48 raon-main text-white flex flex-col justify-between items-center py-5 px-3 flex-shrink-0 z-20 shadow-xl h-full">
        <div class="w-full flex flex-col items-center flex-1 min-h-0">
            
            <!-- 브랜드 로고 영역 -->
            <div class="mb-5 text-center px-1 flex-shrink-0">
                <img src="images/rogo.png" 
                     alt="라온프라이빗 로고" 
                     onerror="this.onerror=null; this.src='https://placehold.co/160x60/0d1b3e/ffffff?text=logo.png';" 
                     class="max-h-14 w-auto mx-auto mb-1.5 object-contain">
            </div>

            <!-- 1차 목차 동적 생성 영역 -->
            <nav class="w-full flex flex-col gap-2.5 overflow-y-auto flex-1 pr-1" id="primaryNav">
                <!-- JS로 자동 나열됩니다 -->
            </nav>
        </div>

        <!-- 하단 고정 브랜드 라벨 -->
        <div class="w-full flex-shrink-0 pt-2 mt-2 flex flex-col gap-2.5 items-center">
            <div class="text-[10px] text-gray-400 text-center tracking-tighter border-t border-white/10 pt-2.5 w-full">
                VIP BRIEFING BOOK
            </div>
        </div>
    </aside>

    <!-- 2차 세부 서브메뉴 (중단 / 연한 회색 배경) -->
    <aside class="w-44 bg-slate-200 border-r border-slate-300 py-6 px-3 flex flex-col flex-shrink-0 z-10 shadow-inner h-full">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 px-2 flex items-center justify-between flex-shrink-0">
            <span id="subCategoryTitle">세부목록</span>
        </div>
        <!-- 2차 세부목차 동적 생성 영역 -->
        <div class="flex flex-col gap-2 overflow-y-auto flex-1 pr-1" id="secondaryNav">
            <!-- JS로 자동 나열됩니다 -->
        </div>
    </aside>

    <!-- 우측 메인 콘텐츠 대화면 영역 -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50">
        
        <!-- 상단 툴바 & 타이틀 바 -->
        <header class="h-10 bg-white border-b border-gray-200 px-8 flex items-center justify-between shadow-sm flex-shrink-0">
            <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-md" id="currentCategoryBadge">사업개요</span>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                <h2 class="text-lg font-bold text-gray-900" id="currentContentTitle">건축개요 및 사업안내</h2>
            </div>

            <!-- 우측 편의 툴바 (업데이트 & 앱 다운로드 & 전체화면) -->
            <div class="flex items-center gap-3">
                
                <!-- 💡 [추가] 강제 새로고침/업데이트 버튼 -->
                <button onclick="forceAppUpdate()" class="text-gray-600 hover:text-slate-900 text-xs p-1.5 rounded-lg hover:bg-gray-100 transition-colors flex items-center gap-1 border border-gray-200" title="최신버전 업데이트">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="font-medium hidden sm:inline">업데이트</span>
                </button>

                <button id="pwaInstallBtn" onclick="installPWAApp()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition-all">
                    <i class="fa-solid fa-download"></i>
                    <span>앱 다운로드</span>
                </button>

                <div class="text-xs text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>상담 전용 브리핑 모드</span>
                </div>

                <button onclick="toggleFullScreen()" class="text-gray-600 hover:text-slate-900 text-sm p-1.5 rounded-lg hover:bg-gray-100 transition-colors" title="전체화면">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </header>

        <!-- 브리핑 뷰어 이미지 영역 -->
        <section class="flex-1 p-4 overflow-hidden flex items-center justify-center bg-slate-900/10 relative" id="contentDisplayArea">
            <!-- JS로 dynamic JPG 이미지 뷰어가 들어갑니다 -->
        </section>

        <!-- 하단 고정 법적 고지 바 -->
        <footer class="h-4 bg-slate-800 text-slate-400 text-[9px] px-6 flex items-center justify-between flex-shrink-0 z-10">
            <span>※ 본 자료는 이해를 돕기 위해 제작된 브리핑 자료로 실제 인허가 및 시공 과정에서 변동될 수 있습니다.</span>
        </footer>
    </main>

    <!-- 모바일 앱 설치 안내 모달 (태블릿 GPU 부하 방지를 위해 backdrop-blur 제거) -->
    <div id="pwaInstallModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-200">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-2">스마트폰 앱 설치</h3>
            <p class="text-xs text-slate-600 mb-4 leading-relaxed">
                브라우저 주소창 없이 바탕화면 앱으로 설치하여 빠르게 브리핑북을 이용하실 수 있습니다.
            </p>
            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-left text-xs text-slate-700 mb-5 space-y-2.5">
                <div class="flex items-center gap-2">
                    <span class="w-5 h-5 bg-emerald-600 text-white rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0">1</span>
                    <span>브라우저 메뉴에서 [홈 화면에 추가] 또는 [앱 설치] 선택</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-5 h-5 bg-emerald-600 text-white rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0">2</span>
                    <span>바탕화면에 생성된 라온스카이브 앱 아이콘 실행</span>
                </div>
            </div>
            <button onclick="closePWAModal()" class="w-full py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800 transition-colors">
                확인 및 닫기
            </button>
        </div>
    </div>
</body>
</html>
